# GitHub Copilot Code Review Configuration
# Documentation: https://docs.github.com/en/copilot/using-github-copilot/code-review/using-copilot-code-review

# Review settings
reviews:
  # Automatically request a review from Copilot on new pull requests
  auto_review: true
  
  # Focus areas for review
  focus_areas:
    - security
    - performance
    - best-practices
    - maintainability

# Paths to include/exclude from review
paths:
  # Include these paths
  include:
    - "custom_components/**/*.py"
  
  # Exclude these paths from review
  exclude:
    - "**/__pycache__/**"
    - "**/tests/**"
