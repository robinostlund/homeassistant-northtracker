name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Update manifest.json with tag version
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          jq --arg version "$VERSION" '.version = $version' custom_components/northtracker/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/northtracker/manifest.json
          echo "Updated manifest.json version to $VERSION"

      - name: Create release zip
        run: |
          cd custom_components/northtracker
          zip -r ../../northtracker.zip .

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configurationJson: |
            {
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feature", "enhancement"]
                },
                {
                  "title": "## 🐛 Bug Fixes",
                  "labels": ["bug", "fix"]
                },
                {
                  "title": "## 🧹 Maintenance",
                  "labels": ["chore", "maintenance", "refactor"]
                },
                {
                  "title": "## 📚 Documentation",
                  "labels": ["documentation"]
                }
              ],
              "template": "#{{CHANGELOG}}\n\n**Full Changelog**: #{{RELEASE_DIFF}}",
              "pr_template": "- #{{TITLE}} (#{{NUMBER}})"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## North-Tracker ${{ steps.get_version.outputs.VERSION }}
            
            ${{ steps.changelog.outputs.changelog }}
            
            ### Installation
            
            #### HACS (Recommended)
            1. Open HACS in Home Assistant
            2. Search for "North-Tracker"
            3. Click Install
            
            #### Manual
            1. Download `northtracker.zip` from the assets below
            2. Extract to `custom_components/northtracker/` in your Home Assistant config directory
            3. Restart Home Assistant
          files: northtracker.zip
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, '-beta') || contains(steps.get_version.outputs.VERSION, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
