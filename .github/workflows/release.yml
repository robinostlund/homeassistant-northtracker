name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Update manifest.json with tag version
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          jq --arg version "$VERSION" '.version = $version' custom_components/northtracker/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/northtracker/manifest.json
          echo "Updated manifest.json version to $VERSION"

      - name: Create release zip
        run: |
          cd custom_components/northtracker
          zip -r ../../northtracker.zip .

      - name: Determine if prerelease
        id: prerelease
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          IS_PRERELEASE="${{ steps.prerelease.outputs.IS_PRERELEASE }}"
          
          # Build release notes
          NOTES="## North-Tracker ${VERSION}

          ### Installation

          #### HACS (Recommended)
          1. Open HACS in Home Assistant
          2. Search for \"North-Tracker\"
          3. Click Install

          #### Manual
          1. Download \`northtracker.zip\` from the assets below
          2. Extract to \`custom_components/northtracker/\` in your Home Assistant config directory
          3. Restart Home Assistant"
          
          # Create release with auto-generated notes
          if [ "$IS_PRERELEASE" = "true" ]; then
            gh release create "$VERSION" northtracker.zip \
              --title "$VERSION" \
              --notes "$NOTES" \
              --generate-notes \
              --prerelease
          else
            gh release create "$VERSION" northtracker.zip \
              --title "$VERSION" \
              --notes "$NOTES" \
              --generate-notes
          fi